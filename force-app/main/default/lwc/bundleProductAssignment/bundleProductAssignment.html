<template>
  <div class="action-shell">
    <header class="action-header">
      <h1>{panelHeader}</h1>
    </header>
    <div class="content">
      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Caricamento"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={errorMessage}>
        <div class="error" role="alert">{errorMessage}</div>
        <lightning-button
          label="Riprova"
          onclick={loadContext}
          disabled={isLoading}
        ></lightning-button>
      </template>
      <template lwc:if={hasLoaded}>
        <template lwc:if={isTranchView}>
          <c-bundle-create-tranch
            record-id={recordId}
            onsaved={handleTranchSaved}
            oncancel={handleTranchCancel}
          ></c-bundle-create-tranch>
        </template>
        <template lwc:else>
          <div class="bundle-heading">
            <div class="bundle-heading-text">
              <span class="eyebrow">CONFIGURAZIONE BUNDLE</span>
              <h2>{bundleName}</h2>
              <p>Le modifiche saranno applicate solo con Salva bundle.</p>
            </div>
          </div>
          <div class="totals">
            <div class="figures">
              <div class="figure">
                <lightning-input
                  data-id="bundle-price"
                  type="number"
                  label="Prezzo prodotto bundle"
                  value={fixedPrice}
                  min="0"
                  step="0.01"
                  formatter="currency"
                  required
                  onchange={handleFixedPriceChange}
                  oninput={handleFixedPriceChange}
                  disabled={isLoading}
                ></lightning-input>
              </div>
              <div class="figure">
                <span class="figure-label">Prezzo listino</span>
                <lightning-formatted-number
                  value={listTotal}
                  format-style="currency"
                  currency-code="EUR"
                  class="figure-value"
                ></lightning-formatted-number>
              </div>
              <div class="figure">
                <span class="figure-label">Totale assegnato</span>
                <lightning-formatted-number
                  data-id="total"
                  value={spreadTotal}
                  format-style="currency"
                  currency-code="EUR"
                  class="figure-value"
                ></lightning-formatted-number>
              </div>
            </div>
            <template lwc:if={hasMissingListPrices}>
              <p class="help" role="status">
                Prezzo listino parziale: almeno un prodotto non ha un prezzo nel
                listino standard.
              </p>
            </template>
          </div>
          <template lwc:if={showMainView}>
            <div class="section-header">
              <h3>{componentLabel}</h3>
              <div class="actions">
                <lightning-button
                  data-id="create-tranch"
                  label="Crea Tranch"
                  icon-name="utility:add"
                  variant="neutral"
                  onclick={handleCreateTranch}
                  disabled={createTranchDisabled}
                ></lightning-button>
                <lightning-button
                  data-id="add"
                  label="Aggiungi prodotti"
                  icon-name="utility:add"
                  variant="brand-outline"
                  onclick={handleAddComponent}
                  disabled={saveDisabled}
                ></lightning-button>
              </div>
            </div>
            <p class="help">
              L'importo assegnato comprende tutta la riga. Cambiare la quantita
              mantiene lo stesso importo e modifica il valore per unita.
            </p>
            <template lwc:if={hasRows}>
              <template lwc:if={hasEditingComponent}>
                <article class="product-card row-editor">
                  <div class="product-card-heading">
                    <div>
                      <span class="eyebrow">MODIFICA COMPONENTE</span>
                      <h3>{editingComponent.name}</h3>
                      <p>Codice: {editingComponent.productCode}</p>
                    </div>
                    <lightning-button-icon
                      icon-name="utility:close"
                      alternative-text="Chiudi modifica"
                      title="Chiudi modifica"
                      variant="border"
                      onclick={handleCloseComponentEditor}
                      disabled={isLoading}
                    ></lightning-button-icon>
                  </div>
                  <div class="reference-price">
                    <div class="unit-price-box">
                      <span class="unit-price-label">Listino unitario</span>
                      <span class="unit-price-value">
                        <lightning-formatted-number
                          value={editingComponent.listPrice}
                          format-style="currency"
                          currency-code="EUR"
                        ></lightning-formatted-number>
                      </span>
                    </div>
                  </div>
                  <div class="row-inputs">
                    <template lwc:if={hasBundleTranches}>
                      <lightning-combobox
                        data-component-editor="true"
                        data-field="bundleTranchId"
                        label="Tranch"
                        value={editingComponent.bundleTranchId}
                        options={bundleTranchOptions}
                        onchange={handleComponentEditChange}
                        disabled={isLoading}
                      ></lightning-combobox>
                    </template>
                    <lightning-input
                      data-component-editor="true"
                      data-field="quantity"
                      type="number"
                      label="Quantita"
                      value={editingComponent.quantity}
                      min="1"
                      step="1"
                      required
                      onchange={handleComponentEditChange}
                      oninput={handleComponentEditChange}
                      disabled={isLoading}
                    ></lightning-input>
                    <lightning-input
                      data-component-editor="true"
                      data-field="discountPercent"
                      type="number"
                      label="Sconto %"
                      value={editingComponent.discountPercent}
                      max="100"
                      step="0.01"
                      onchange={handleComponentEditChange}
                      oninput={handleComponentEditChange}
                      disabled={editingComponent.discountDisabled}
                    ></lightning-input>
                    <lightning-input
                      data-component-editor="true"
                      data-field="spreadPrice"
                      type="number"
                      label="Prezzo totale della riga"
                      value={editingComponent.spreadPrice}
                      min="0"
                      step="0.01"
                      formatter="currency"
                      onchange={handleComponentEditChange}
                      oninput={handleComponentEditChange}
                      disabled={isLoading}
                    ></lightning-input>
                  </div>
                  <div class="line-summary editor-preview">
                    <span class="preview-item">
                      <span class="preview-label">Sconto:</span>
                      <span>{editingComponent.discountLabel}</span>
                    </span>
                    <span class="preview-item">
                      <span class="preview-label">Prezzo riga:</span>
                      <lightning-formatted-number
                        value={editingComponent.spreadPrice}
                        format-style="currency"
                        currency-code="EUR"
                      ></lightning-formatted-number>
                    </span>
                    <span class="preview-item">
                      <span class="preview-label">Totale assegnato:</span>
                      <lightning-formatted-number
                        value={spreadTotal}
                        format-style="currency"
                        currency-code="EUR"
                      ></lightning-formatted-number>
                    </span>
                  </div>
                  <div class="editor-actions">
                    <lightning-button
                      label="Chiudi"
                      onclick={handleCloseComponentEditor}
                      disabled={isLoading}
                    ></lightning-button>
                    <lightning-button
                      label="Salva modifica"
                      variant="brand"
                      onclick={handleSaveComponentEdit}
                      disabled={isLoading}
                    ></lightning-button>
                  </div>
                </article>
              </template>
              <template lwc:else>
                <div class="table-container">
                  <lightning-datatable
                    data-id="components"
                    key-field="key"
                    data={rows}
                    columns={componentColumns}
                    hide-checkbox-column
                    suppress-bottom-bar
                    onrowaction={handleRowAction}
                  ></lightning-datatable>
                </div>
              </template>
            </template>
            <template lwc:else>
              <div class="empty-state">
                <lightning-icon
                  icon-name="utility:package"
                  size="medium"
                ></lightning-icon>
                <h3>Componi il tuo bundle</h3>
                <p>
                  Aggiungi piu prodotti insieme, poi imposta quantita e importi.
                </p>
              </div>
            </template>
            <p class="pending" role="status">{pendingLabel}</p>
          </template>
          <template lwc:else>
            <div class="picker-intro">
              <span class="eyebrow">COMPONI IL TUO BUNDLE</span>
              <h3>Scegli un prodotto, poi imposta quantita e prezzo</h3>
              <p>Aggiungi altre righe oppure salva tutti i prodotti insieme.</p>
            </div>
            <template lwc:if={hasSelection}>
              <section
                class="pending-products"
                aria-label="Prodotti da aggiungere"
              >
                <h3 class="selection-summary" role="status">{selectedLabel}</h3>
                <template for:each={selectedProducts} for:item="row">
                  <article class="product-card" key={row.key}>
                    <div class="product-card-heading">
                      <div>
                        <h3>{row.name}</h3>
                        <p>Codice: {row.productCode}</p>
                      </div>
                      <div class="card-actions">
                        <lightning-button-icon
                          icon-name="utility:delete"
                          alternative-text="Rimuovi prodotto"
                          title="Rimuovi prodotto"
                          variant="border"
                          data-key={row.key}
                          onclick={handleRemovePending}
                          disabled={isLoading}
                        ></lightning-button-icon>
                      </div>
                    </div>
                    <div class="line-summary">
                      <span>Quantita: {row.quantityDisplay}</span>
                      <span>Sconto: {row.selectedDiscountDisplay}</span>
                      <span>Prezzo riga: {row.selectedPriceDisplay}</span>
                    </div>
                    <template lwc:if={row.pendingPriceError}>
                      <p class="row-error" role="alert">
                        {row.pendingPriceError}
                      </p>
                    </template>
                    <div class="reference-price">
                      <template lwc:if={row.hasListPrice}>
                        <div class="unit-price-box">
                          <span class="unit-price-label">Listino unitario</span>
                          <span class="unit-price-value"
                            >{row.listPriceDisplay}</span
                          >
                        </div>
                      </template>
                      <template lwc:else>
                        <span
                          >Listino unitario: non disponibile nel listino
                          standard</span
                        >
                      </template>
                    </div>
                    <div class="row-inputs">
                      <template lwc:if={hasBundleTranches}>
                        <lightning-combobox
                          data-pending="true"
                          data-key={row.key}
                          data-field="bundleTranchId"
                          label="Tranch"
                          value={row.bundleTranchId}
                          options={bundleTranchOptions}
                          onchange={handlePendingChange}
                          disabled={isLoading}
                        ></lightning-combobox>
                      </template>
                      <lightning-input
                        data-pending="true"
                        data-key={row.key}
                        data-field="quantity"
                        type="number"
                        label="Quantita"
                        value={row.quantity}
                        min="1"
                        step="1"
                        required
                        onchange={handlePendingChange}
                        disabled={isLoading}
                      ></lightning-input>
                      <lightning-input
                        data-pending="true"
                        data-key={row.key}
                        data-field="discountPercent"
                        type="number"
                        label="Sconto %"
                        value={row.discountPercent}
                        max="100"
                        step="0.01"
                        onchange={handlePendingChange}
                        oninput={handlePendingChange}
                        disabled={row.discountDisabled}
                      ></lightning-input>
                      <lightning-input
                        data-pending="true"
                        data-key={row.key}
                        data-field="spreadPrice"
                        type="number"
                        label="Prezzo totale della riga"
                        value={row.spreadPrice}
                        min="0"
                        step="0.01"
                        formatter="currency"
                        onchange={handlePendingChange}
                        oninput={handlePendingChange}
                        disabled={isLoading}
                        field-level-help="Importo assegnato a tutte le unita di questa riga, non alla singola unita."
                      ></lightning-input>
                    </div>
                    <p class="help">
                      Inserisci lo sconto sul listino o il prezzo totale della
                      riga. Il prezzo comprende tutta la quantita; inserisci 0
                      per un omaggio. Se manca il listino, inserisci il prezzo
                      della riga.
                    </p>
                  </article>
                </template>
              </section>
              <template lwc:if={isChoosingProduct}></template>
              <template lwc:else>
                <lightning-button
                  class="add-another"
                  data-id="add-another"
                  label="Aggiungi un altro prodotto"
                  icon-name="utility:add"
                  variant="brand-outline"
                  onclick={handleAddAnother}
                  disabled={isLoading}
                ></lightning-button>
              </template>
            </template>
            <template lwc:if={isChoosingProduct}>
              <section class="product-search" aria-label="Cerca un prodotto">
                <div class="filters">
                  <lightning-input
                    data-id="search"
                    type="search"
                    label="Cerca per codice prodotto o nome"
                    placeholder="Inserisci un codice, un nome o parte del testo"
                    value={searchTerm}
                    onchange={handleSearchInput}
                    disabled={isLoading}
                  ></lightning-input>
                </div>
                <div class="search-results">
                  <template lwc:if={isSearching}
                    ><lightning-spinner
                      alternative-text="Ricerca prodotti"
                      size="small"
                    ></lightning-spinner
                  ></template>
                  <template lwc:if={searchError}>
                    <div class="error" role="alert">{searchError}</div>
                    <lightning-button
                      label="Riprova ricerca"
                      onclick={handleRetrySearch}
                      disabled={isSearching}
                    ></lightning-button>
                  </template>
                  <template lwc:if={hasProducts}>
                    <lightning-datatable
                      data-id="products"
                      key-field="id"
                      data={products}
                      columns={productColumns}
                      selected-rows={selectedSearchProductIds}
                      onrowselection={handleProductSelection}
                      onrowaction={handleChooseProduct}
                    ></lightning-datatable>
                  </template>
                  <template lwc:if={showNoProducts}>
                    <div class="empty-state">
                      <h3>Nessun prodotto trovato</h3>
                      <p>
                        Prova un altro codice o nome. I prodotti gia presenti o
                        selezionati sono esclusi.
                      </p>
                    </div>
                  </template>
                </div>
                <div class="result-footer">
                  <span>{resultLabel}</span>
                  <lightning-button
                    data-id="add-search-selection"
                    label={searchSelectionLabel}
                    variant="brand-outline"
                    onclick={handleAddSearchSelection}
                    disabled={addSearchSelectionDisabled}
                  ></lightning-button>
                  <template lwc:if={hasMore}
                    ><lightning-button
                      data-id="more"
                      label="Carica altri"
                      onclick={handleLoadMore}
                      disabled={isSearching}
                    ></lightning-button
                  ></template>
                </div>
              </section>
            </template>
            <p class="help">
              Aggiungi tutti riporta le righe nel riepilogo per il salvataggio.
            </p>
          </template>
        </template>
      </template>
    </div>
    <footer class="action-footer">
      <template lwc:if={showBundleFooter}>
        <template lwc:if={showMainView}>
          <lightning-button
            label="Annulla"
            onclick={handleCancel}
            disabled={isLoading}
          ></lightning-button>
          <lightning-button
            data-id="save"
            class="slds-m-left_small"
            label="Salva bundle"
            variant="brand"
            onclick={handleSave}
            disabled={saveDisabled}
          ></lightning-button>
        </template>
        <template lwc:else>
          <lightning-button
            label="Indietro"
            onclick={handleBack}
            disabled={isLoading}
          ></lightning-button>
          <lightning-button
            data-id="add-selected"
            class="slds-m-left_small"
            label={selectionLabel}
            variant="brand"
            onclick={handleAddSelected}
            disabled={addSelectionDisabled}
          ></lightning-button>
        </template>
      </template>
    </footer>
  </div>
</template>
