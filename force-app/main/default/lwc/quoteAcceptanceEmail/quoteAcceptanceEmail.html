<template>
  <lightning-quick-action-panel header="Invia preventivo per accettazione">
    <template lwc:if={busy}>
      <lightning-spinner
        alternative-text="Operazione in corso"
        size="small"
      ></lightning-spinner>
    </template>
    <template lwc:if={errorMessage}>
      <div role="alert" class="slds-text-color_error slds-m-bottom_small">
        {errorMessage}
      </div>
    </template>
    <template lwc:if={isBlocked}>
      <div
        role="alert"
        class="slds-notify slds-notify_alert slds-alert_error mapping-alert"
      >
        <div>
          <p class="slds-text-heading_small slds-m-bottom_x-small">
            Invio bloccato: mappatura edizione mancante
          </p>
          <p class="slds-m-bottom_x-small">
            Questi prodotti generano biglietti ma non hanno una campagna figlia
            mappata alla data odierna. Senza mappatura l'ordine non può essere
            generato alla firma.
          </p>
          <ul class="slds-list_dotted">
            <template for:each={mappingProblems} for:item="problem">
              <li key={problem}>{problem}</li>
            </template>
          </ul>
          <p class="slds-m-top_x-small">
            Aggiungi la mappatura in Mappatura Edizione e riapri l'invio.
          </p>
        </div>
      </div>
    </template>
    <template lwc:if={showForm}>
      <template lwc:if={missingRecipient}>
        <p class="slds-m-bottom_small">
          Email del contatto principale non disponibile. Inserisci il
          destinatario.
        </p>
      </template>
      <lightning-input
        type="email"
        name="recipient"
        label="Destinatario"
        value={recipient}
        onchange={handleChange}
        required
        maxlength="254"
        disabled={busy}
      ></lightning-input>
      <lightning-input
        type="text"
        name="subject"
        label="Oggetto"
        value={subject}
        onchange={handleChange}
        required
        maxlength="255"
        disabled={busy}
      ></lightning-input>
      <lightning-textarea
        name="body"
        label="Messaggio"
        value={body}
        onchange={handleChange}
        required
        maxlength="32000"
        message-when-too-long="Il messaggio non può superare 32000 caratteri."
        field-level-help="Il pulsante per consultare, accettare o rifiutare il preventivo e la firma vengono aggiunti automaticamente dopo il messaggio."
        disabled={busy}
      ></lightning-textarea>
      <div
        class="system-footer-preview slds-box slds-m-top_medium"
        aria-label="Contenuto aggiunto automaticamente"
      >
        <p class="slds-text-title_bold slds-m-bottom_small">
          Contenuto aggiunto automaticamente
        </p>
        <p>Puoi consultare, accettare o rifiutare il preventivo:</p>
        <p class="slds-m-vertical_medium">
          <span
            class="slds-button slds-button_brand preview-button"
            aria-disabled="true"
          >
            Apri il preventivo
          </span>
        </p>
        <p>Grazie,<br />Il team Pienissimo</p>
      </div>
    </template>
    <div slot="footer">
      <lightning-button
        label="Annulla"
        onclick={handleCancel}
        disabled={isSending}
      ></lightning-button>
      <lightning-button
        class="slds-m-left_small"
        label="Invia email"
        variant="brand"
        onclick={handleSend}
        disabled={sendDisabled}
      ></lightning-button>
    </div>
  </lightning-quick-action-panel>
</template>
