<template>
  <lightning-quick-action-panel header="Gestisci Prodotti">
    <div class="content">
      <template if:true={showInitialLoader}>
        <div class="loader">
          <lightning-spinner
            alternative-text="Caricamento"
            size="medium"
          ></lightning-spinner>
        </div>
      </template>

      <template if:true={hasLoaded}>
        <template if:true={isLoading}>
          <lightning-spinner
            alternative-text="Caricamento"
            size="small"
          ></lightning-spinner>
        </template>

        <div class="summary">
          <div>
            <div class="summary-label">Preventivo</div>
            <div class="summary-value">{quoteName}</div>
          </div>
          <div>
            <div class="summary-label">Stato</div>
            <div class={statusClass}>{quoteStatus}</div>
          </div>
        </div>

        <template if:true={hasExistingBundle}>
          <div class="message error">
            Il preventivo contiene gia un bundle. Non puoi aggiungerne un altro.
          </div>
          <div class="existing-box">
            <div class="section-label">Bundle esistente</div>
            <div class="product-title">{existingBundleLine.productName}</div>
            <div class="product-meta">
              <span>{existingBundleLine.productCode}</span>
            </div>
          </div>
        </template>

        <template if:false={hasExistingBundle}>
          <template if:true={showPlusLineMessage}>
            <div class="message error">
              Questo preventivo puo contenere un solo prodotto Plus.
            </div>
          </template>

          <template if:true={hasModeMessage}>
            <div class="message">{modeMessage}</div>
          </template>

          <template if:false={isPickerOpen}>
            <div class="overview-actions">
              <lightning-button
                variant="brand"
                label="Aggiungi prodotti"
                icon-name="utility:add"
                disabled={addProductsDisabled}
                onclick={handleOpenPicker}
              ></lightning-button>
            </div>

            <template if:true={showExistingProducts}>
              <div class="selected-panel">
                <div class="section-label">Righe gia nel preventivo</div>
                <div class="selected-table">
                  <div class="selected-header">
                    <span>Prodotto</span>
                    <span>Qta</span>
                    <span>Stato</span>
                    <span></span>
                  </div>
                  <div class="selected-body">
                    <template for:each={existingProducts} for:item="product">
                      <div class="selected-row" key={product.rowKey}>
                        <div class="selected-main">
                          <div class="product-title">{product.productName}</div>
                          <div class="product-meta">
                            <span>{product.productCode}</span>
                            <span>{product.typeLabel}</span>
                            <span>Prezzo {product.unitPrice}</span>
                          </div>
                        </div>
                        <template if:true={product.isExisting}>
                          <span class="quantity-static"
                            >{product.quantity}</span
                          >
                        </template>
                        <span class="row-status">{product.rowStatus}</span>
                        <span></span>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <template if:true={showNewSelection}>
              <div class="selected-panel new-selection-panel">
                <div class="section-label">Prodotti scelti da aggiungere</div>
                <div class="selected-table">
                  <div class="selected-header">
                    <span>Prodotto</span>
                    <span>Qta</span>
                    <span>Stato</span>
                    <span></span>
                  </div>
                  <div class="selected-body">
                    <template for:each={selectedProducts} for:item="product">
                      <div class="selected-row" key={product.rowKey}>
                        <div class="selected-main">
                          <div class="product-title">{product.productName}</div>
                          <div class="product-meta">
                            <span>{product.productCode}</span>
                            <span>{product.typeLabel}</span>
                            <span>Prezzo {product.unitPrice}</span>
                          </div>
                        </div>
                        <lightning-input
                          class="quantity-input"
                          type="number"
                          label="Quantita"
                          value={product.quantity}
                          min="0.01"
                          step="0.01"
                          data-id={product.pricebookEntryId}
                          variant="label-hidden"
                          disabled={product.quantityDisabled}
                          required
                          onchange={handleQuantityChange}
                        ></lightning-input>
                        <span class="row-status">{product.rowStatus}</span>
                        <lightning-button-icon
                          icon-name="utility:delete"
                          alternative-text="Rimuovi"
                          title="Rimuovi"
                          variant="bare"
                          data-id={product.pricebookEntryId}
                          onclick={handleRemoveProduct}
                        ></lightning-button-icon>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </template>

          <template if:true={isPickerOpen}>
            <div class="selector-panel">
              <div class="selector-heading">
                <div>
                  <div class="section-label">Selezione prodotti</div>
                  <div class="selector-title">Prodotti disponibili</div>
                </div>
                <lightning-button
                  label="Torna indietro"
                  icon-name="utility:back"
                  onclick={handleClosePicker}
                ></lightning-button>
              </div>

              <lightning-input
                type="search"
                label="Filtra per codice o nome"
                value={searchTerm}
                disabled={isSearchDisabled}
                onchange={handleSearchChange}
              ></lightning-input>

              <template if:true={hasProductOptions}>
                <div class="available-table">
                  <div class="available-header">
                    <span>Prodotto disponibile</span>
                    <span>Azione</span>
                  </div>
                  <div class="options">
                    <template for:each={productOptions} for:item="option">
                      <button
                        key={option.pricebookEntryId}
                        type="button"
                        class={option.buttonClass}
                        data-id={option.pricebookEntryId}
                        disabled={option.isDisabled}
                        onclick={handleSelectProduct}
                      >
                        <span class="option-main">
                          <span class="product-title"
                            >{option.productName}</span
                          >
                          <span class="product-meta">
                            <span>{option.productCode}</span>
                            <span>{option.typeLabel}</span>
                            <span>{option.unitPrice}</span>
                          </span>
                        </span>
                        <template if:true={option.isSelected}>
                          <span class="remove-marker">
                            <lightning-icon
                              icon-name="utility:close"
                              size="xx-small"
                              alternative-text="Rimuovi"
                            ></lightning-icon>
                            <span>Rimuovi</span>
                          </span>
                        </template>
                        <template if:false={option.isSelected}>
                          <span class="choose-marker">Scegli</span>
                        </template>
                      </button>
                    </template>
                  </div>
                </div>
              </template>

              <template if:true={showNoResultsMessage}>
                <div class="message">Nessun prodotto disponibile.</div>
              </template>
            </div>
          </template>

          <template if:true={showTranchePlanner}>
            <div class="tranche-planner">
              <lightning-input
                type="number"
                label="Numero tranche"
                value={trancheCount}
                min="1"
                max="20"
                step="1"
                required
                onchange={handleTrancheCountChange}
              ></lightning-input>

              <template if:true={hasPlannedTranches}>
                <div class="tranche-list">
                  <template for:each={plannedTranches} for:item="tranche">
                    <div class="tranche-row" key={tranche.key}>
                      <div class="tranche-sequence">
                        Tranche {tranche.sequence}
                      </div>
                      <div class="amount-box">
                        <span class="box-label">Prezzo</span>
                        <span>{tranche.amountLabel}</span>
                      </div>
                      <lightning-input
                        class="due-date-input"
                        type="date"
                        label="Data scadenza"
                        value={tranche.dueDate}
                        data-index={tranche.index}
                        required
                        onchange={handleTrancheDueDateChange}
                      ></lightning-input>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </template>
      </template>
    </div>

    <div slot="footer">
      <lightning-button
        label="Annulla"
        onclick={handleCancel}
      ></lightning-button>
      <lightning-button
        variant="brand"
        label="Salva"
        disabled={isPrimaryDisabled}
        onclick={handleSave}
        class="slds-m-left_small"
      ></lightning-button>
    </div>
  </lightning-quick-action-panel>
</template>
