<template>
  <lightning-quick-action-panel header="Nuovo Preventivo">
    <div class="content">
      <template if:true={isLoading}>
        <div class="loader">
          <lightning-spinner
            alternative-text="Caricamento"
            size="medium"
          ></lightning-spinner>
        </div>
      </template>

      <template if:false={isLoading}>
        <template if:true={errorMessage}>
          <div class="message error">{errorMessage}</div>
        </template>

        <template if:false={errorMessage}>
          <section class="section">
            <div class="section-title">Dati Preventivo</div>
            <div class="grid">
              <lightning-input
                label="Quote Name"
                value={form.quoteName}
                data-field="quoteName"
                onchange={handleInputChange}
                required
              ></lightning-input>
              <lightning-input
                label="Opportunity Name"
                value={form.opportunityName}
                disabled
              ></lightning-input>
              <lightning-input
                label="Account Name"
                value={form.accountName}
                disabled
              ></lightning-input>
              <lightning-input
                label="Status"
                value={form.status}
                disabled
              ></lightning-input>
              <lightning-input
                type="date"
                label="Expiration Date"
                value={form.expirationDate}
                data-field="expirationDate"
                onchange={handleInputChange}
                required
              ></lightning-input>
              <lightning-combobox
                label="Condizione di Pagamento"
                value={form.paymentCondition}
                options={paymentConditionOptions}
                data-field="paymentCondition"
                onchange={handleInputChange}
                required
              ></lightning-combobox>
              <lightning-input
                type="checkbox"
                label="Primario"
                checked={form.isPrimary}
                data-field="isPrimary"
                onchange={handleInputChange}
                class="primary-checkbox"
              ></lightning-input>
            </div>
          </section>
        </template>
      </template>
    </div>

    <div slot="footer">
      <lightning-button
        label="Cancel"
        onclick={handleCancel}
      ></lightning-button>
      <lightning-button
        variant="brand"
        label={saveButtonLabel}
        disabled={isSaveDisabled}
        onclick={handleSave}
        class="slds-m-left_small"
      ></lightning-button>
    </div>
  </lightning-quick-action-panel>
</template>
