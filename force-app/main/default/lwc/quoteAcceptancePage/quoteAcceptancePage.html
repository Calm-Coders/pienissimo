<template>
  <main class="page-shell">
    <section class="quote-panel" aria-labelledby="page-heading">
      <header class="page-header">
        <img class="brand-logo" src={logoUrl} alt="Pienissimo" />
        <h1 id="page-heading">{heading}</h1>
      </header>

      <template if:true={isLoading}>
        <div class="loading-panel" role="status" aria-live="polite">
          <lightning-spinner
            alternative-text="Caricamento preventivo"
            size="medium"
          ></lightning-spinner>
          <p>Caricamento preventivo...</p>
        </div>
      </template>

      <template if:true={errorMessage}>
        <div class="message message-error" role="alert">{errorMessage}</div>
      </template>

      <template if:true={showPageContent}>
        <section class="quote-summary" aria-labelledby="quote-heading">
          <div>
            <p class="eyebrow">Preventivo {page.quoteNumber}</p>
            <h2 id="quote-heading">{quoteLabel}</h2>
          </div>
          <div class="total-box">
            <span>Totale</span>
            <strong>
              <lightning-formatted-number
                value={page.grandTotal}
                format-style="currency"
                currency-code="EUR"
              ></lightning-formatted-number>
            </strong>
          </div>
        </section>

        <div class="context-grid">
          <div>
            <span class="context-label">Azienda</span>
            <strong>{accountLabel}</strong>
          </div>
          <div>
            <span class="context-label">Opportunita</span>
            <strong>{opportunityLabel}</strong>
          </div>
          <div>
            <span class="context-label">Stato</span>
            <strong class={statusClass}>{page.status}</strong>
          </div>
          <template if:true={page.expirationDate}>
            <div>
              <span class="context-label">Scadenza</span>
              <strong>
                <lightning-formatted-date-time
                  value={page.expirationDate}
                  day="2-digit"
                  month="long"
                  year="numeric"
                ></lightning-formatted-date-time>
              </strong>
            </div>
          </template>
        </div>

        <section class="line-section" aria-labelledby="lines-heading">
          <h2 id="lines-heading">Righe preventivo</h2>

          <template if:true={showLines}>
            <div class="line-table-wrapper">
              <table class="line-table">
                <thead>
                  <tr>
                    <th scope="col">Articolo e Descrizione</th>
                    <th scope="col">Unita di misura</th>
                    <th scope="col">Quantita</th>
                    <th scope="col">Prezzo Listino</th>
                    <th scope="col">Importo</th>
                    <th scope="col">Sconto</th>
                    <th scope="col">Totale Netto</th>
                    <th scope="col">Scadenza Pagamento</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={lines} for:item="line">
                    <tr key={line.id}>
                      <td data-label="Articolo e Descrizione">
                        <strong>{line.productName}</strong>
                        <template if:true={line.description}>
                          <span class="line-description"
                            >{line.description}</span
                          >
                        </template>
                      </td>
                      <td data-label="Unita di misura">{line.unitOfMeasure}</td>
                      <td data-label="Quantita" class="number-cell">
                        <lightning-formatted-number
                          value={line.quantity}
                        ></lightning-formatted-number>
                      </td>
                      <td data-label="Prezzo Listino" class="number-cell">
                        <lightning-formatted-number
                          value={line.listPrice}
                          format-style="currency"
                          currency-code="EUR"
                        ></lightning-formatted-number>
                      </td>
                      <td data-label="Importo" class="number-cell">
                        <lightning-formatted-number
                          value={line.amount}
                          format-style="currency"
                          currency-code="EUR"
                        ></lightning-formatted-number>
                      </td>
                      <td data-label="Sconto" class="number-cell">
                        <lightning-formatted-number
                          value={line.discount}
                          format-style="currency"
                          currency-code="EUR"
                        ></lightning-formatted-number>
                      </td>
                      <td data-label="Totale Netto" class="number-cell">
                        <lightning-formatted-number
                          value={line.totalPrice}
                          format-style="currency"
                          currency-code="EUR"
                        ></lightning-formatted-number>
                      </td>
                      <td data-label="Scadenza Pagamento">
                        <lightning-formatted-date-time
                          value={line.dueDate}
                          day="2-digit"
                          month="2-digit"
                          year="numeric"
                        ></lightning-formatted-date-time>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template if:false={showLines}>
            <div class="message message-neutral">
              Nessuna riga preventivo disponibile.
            </div>
          </template>
        </section>

        <template if:true={showStatusMessage}>
          <div class="message message-success" role="status">
            {page.message}
          </div>
        </template>

        <template if:true={showActions}>
          <footer class="action-bar">
            <lightning-button
              label="Annulla preventivo"
              icon-name="utility:close"
              variant="destructive"
              disabled={actionDisabled}
              onclick={openRejectConfirmation}
            ></lightning-button>
            <lightning-button
              label="Conferma preventivo"
              icon-name="utility:success"
              variant="brand"
              disabled={actionDisabled}
              onclick={openAcceptConfirmation}
            ></lightning-button>
          </footer>
        </template>
      </template>
    </section>
  </main>

  <template if:true={showConfirmation}>
    <section
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmation-heading"
      tabindex="-1"
      onkeydown={handleModalKeydown}
    >
      <div class="confirmation-card">
        <h2 id="confirmation-heading">{confirmTitle}</h2>
        <p>{confirmMessage}</p>
        <div class="confirmation-actions">
          <lightning-button
            label="Indietro"
            onclick={closeConfirmation}
          ></lightning-button>
          <lightning-button
            label={confirmButtonLabel}
            variant={confirmButtonVariant}
            onclick={confirmAction}
          ></lightning-button>
        </div>
      </div>
    </section>
    <div class="backdrop"></div>
  </template>

  <template if:true={isSubmitting}>
    <div class="submission-overlay" role="status" aria-live="assertive">
      <lightning-spinner
        alternative-text="Aggiornamento preventivo"
        size="large"
      ></lightning-spinner>
      <p>Aggiornamento in corso...</p>
    </div>
  </template>
</template>
