<template>
  <lightning-quick-action-panel header={panelHeader}>
    <div class="content">
      <template if:true={showInitialLoader}>
        <div class="initial-loader">
          <lightning-spinner
            alternative-text="Caricamento"
            size="medium"
          ></lightning-spinner>
        </div>
      </template>

      <template if:true={hasLoaded}>
        <template if:true={isLoading}>
          <lightning-spinner
            alternative-text="Caricamento"
            size="small"
          ></lightning-spinner>
        </template>

        <div class="summary">
          <div>
            <div class="summary-label">Preventivo</div>
            <div class="summary-value">{quoteName}</div>
          </div>
          <div>
            <div class="summary-label">Stato</div>
            <div class={statusClass}>{quoteStatus}</div>
          </div>
        </div>

        <template if:false={isEditable}>
          <div class="message warning">
            Le tranche possono essere create o modificate solo quando il
            preventivo e in bozza.
          </div>
        </template>

        <template if:true={isEditMode}>
          <div class="section-header edit-selector-header">
            <h3 class="section-heading">Tranche esistenti</h3>
            <span>Seleziona una tranche da modificare</span>
          </div>
          <div class="edit-tranche-list">
            <template for:each={editTrancheCards} for:item="tranche">
              <button
                key={tranche.key}
                type="button"
                class={tranche.cardClass}
                data-index={tranche.index}
                disabled={isSaveDisabledByStatus}
                onclick={handleSelectEditTranche}
              >
                <span class="edit-tranche-main">
                  <span class="edit-tranche-title">{tranche.name}</span>
                  <span class="edit-tranche-meta">
                    <span>Sequenza {tranche.sequence}</span>
                    <span>{tranche.dueDateLabel}</span>
                    <span>{tranche.lineCountLabel}</span>
                  </span>
                </span>
              </button>
            </template>
          </div>
        </template>

        <template if:false={isEditMode}>
          <div class="count-row">
            <lightning-input
              type="number"
              label="Numero di tranche"
              value={trancheCount}
              min="1"
              max="20"
              step="1"
              required
              disabled={isSaveDisabledByStatus}
              onchange={handleTrancheCountChange}
            ></lightning-input>
          </div>
        </template>

        <template if:true={hasPlannedTranches}>
          <template if:false={isEditMode}>
            <div class="pager">
              <lightning-button-icon
                icon-name="utility:chevronleft"
                alternative-text="Tranche precedente"
                title="Tranche precedente"
                disabled={isPreviousDisabled}
                onclick={handlePreviousTranche}
              ></lightning-button-icon>
              <div class="pager-label">{currentTrancheLabel}</div>
              <lightning-button-icon
                icon-name="utility:chevronright"
                alternative-text="Tranche successiva"
                title="Tranche successiva"
                disabled={isNextDisabled}
                onclick={handleNextTranche}
              ></lightning-button-icon>
            </div>
          </template>

          <template if:true={pageValidationMessage}>
            <div class="message error">{pageValidationMessage}</div>
          </template>

          <div class="tranche-card">
            <template if:true={showDeleteCurrentPage}>
              <div class="delete-page-actions">
                <lightning-button
                  label="Elimina questa tranche"
                  variant="destructive"
                  disabled={isDeleteCurrentPageDisabled}
                  onclick={handleDeleteCurrentPage}
                ></lightning-button>
              </div>
            </template>

            <div class="tranche-row">
              <div class="sequence-badge">{currentTranche.sequence}</div>
              <lightning-input
                type="text"
                label="Nome tranche"
                value={currentTranche.name}
                data-index={currentTranche.index}
                required
                disabled={isSaveDisabledByStatus}
                onchange={handlePlannedNameChange}
              ></lightning-input>
              <lightning-input
                type="date"
                label="Data scadenza"
                value={currentTranche.dueDate}
                data-index={currentTranche.index}
                data-current-tranche-due-date
                required
                disabled={isSaveDisabledByStatus}
                onchange={handlePlannedDueDateChange}
              ></lightning-input>
            </div>

            <div class="section-header">
              <h3 class="section-heading">Righe preventivo</h3>
              <span>{currentSelectionLabel}</span>
            </div>

            <template if:true={hasQuoteLines}>
              <template if:true={hasCurrentSelectedLines}>
                <div class="line-group">
                  <div class="line-group-title">Assegnate a questa tranche</div>
                  <div class="quote-line-list">
                    <template for:each={currentSelectedLines} for:item="line">
                      <div class="quote-line-card selected" key={line.id}>
                        <div class="line-main">
                          <div class="line-title">{line.productName}</div>
                          <div class="line-meta">
                            <span>{line.productCode}</span>
                            <span>Qta {line.quantity}</span>
                            <span>Totale {line.totalLabel}</span>
                          </div>
                        </div>
                        <lightning-button-icon
                          icon-name="utility:delete"
                          alternative-text="Rimuovi riga"
                          title="Rimuovi riga"
                          variant="bare"
                          data-id={line.id}
                          disabled={isSaveDisabledByStatus}
                          onclick={handleRemoveLine}
                        ></lightning-button-icon>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <template if:true={hasAvailableQuoteLines}>
                <div class="line-group">
                  <div class="line-group-title">
                    Righe preventivo disponibili
                  </div>
                  <div class="quote-line-list">
                    <template for:each={availableQuoteLines} for:item="line">
                      <div class="quote-line-card" key={line.id}>
                        <div class="line-main">
                          <div class="line-title">{line.productName}</div>
                          <div class="line-meta">
                            <span>{line.productCode}</span>
                            <span>Qta {line.quantity}</span>
                            <span>Totale {line.totalLabel}</span>
                          </div>
                        </div>
                        <lightning-button
                          label="Assegna a questa tranche"
                          data-id={line.id}
                          disabled={isSaveDisabledByStatus}
                          onclick={handleAssignLine}
                        ></lightning-button>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <template if:false={hasAvailableQuoteLines}>
                <template if:false={hasCurrentSelectedLines}>
                  <div class="message">
                    Nessuna riga preventivo disponibile per questa tranche.
                  </div>
                </template>
              </template>
            </template>

            <template if:false={hasQuoteLines}>
              <div class="message">
                Questo preventivo non contiene righe prodotto.
              </div>
            </template>
          </div>
        </template>
      </template>
    </div>

    <div slot="footer">
      <lightning-button
        label="Annulla"
        onclick={handleCancel}
      ></lightning-button>
      <lightning-button
        variant="brand"
        label={saveButtonLabel}
        disabled={isSaveDisabled}
        onclick={handleSave}
        class="slds-m-left_small"
      ></lightning-button>
    </div>
  </lightning-quick-action-panel>
</template>
