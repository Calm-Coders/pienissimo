[mcp_servers.open-codebase-index]
command = "npx"
args = ["--no-install", "open-codebase-index-mcp", "--host", "codex", "--project", "."]
startup_timeout_sec = 30
tool_timeout_sec = 120
required = false
default_tools_approval_mode = "approve"
enabled_tools = [
  "codebase_context",
  "codebase_edit_context",
  "codebase_search",
  "codebase_peek",
  "index_codebase",
  "index_status",
  "index_health_check",
  "index_metrics",
  "index_logs",
  "find_similar",
  "implementation_lookup",
  "call_graph",
  "call_graph_path",
  "pr_impact",
  "code_communities",
]

[mcp_servers.graphify-sfdx]
command = "python"
args = ["-X", "utf8", "scripts/graphify_serve_fresh.py", "graphify-out/graph.json"]
startup_timeout_sec = 30
tool_timeout_sec = 120
required = false
default_tools_approval_mode = "approve"
