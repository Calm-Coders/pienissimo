        reverses the direction of the outstanding credential: with the integration
        pushing from WooCommerce, ROMI owes Pienissimo a Salesforce endpoint and a
        header token. Whether Salesforce still reads orders back over the WooCommerce
        REST API — and therefore whether CK/CS are needed at all — was not decided.
        The two instances were not revisited. 2026-08-28: Sabatino's half is
        delivered — the payload attachment of 27/08 was downloaded and decoded, so
        the inbound contract is known and only ROMI's endpoint and token remain
        outstanding. The example carries no top-level shop identifier, so how the
        endpoint would tell the two instances apart is still unanswered",
