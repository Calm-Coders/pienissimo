# =============================================================================
# STATE MACHINES — extracted verbatim from the diagrams
# =============================================================================
state_machines:
  lead:
    source: [DGM-1, DGM-2]
    states:
      [
        New,
        In Lavorazione,
        Non Risponde,
        Primo contatto,
        Qualificato,
        Non qualificato
      ]
    transitions:
      - { from: New, to: In Lavorazione }
      - { from: In Lavorazione, to: Non Risponde }
      - { from: In Lavorazione, to: Primo contatto }
      - {
          from: Non Risponde,
          to: "Task = da ricontattare",
          note: "auto task/event with red reminder 48h after the status change"
        }
      - { from: Primo contatto, to: Qualificato }
      - { from: Primo contatto, to: Non qualificato }
      - {
          from: Qualificato,
          to: "OPPORTUNITA'",
          note: "Lead converted into ACCOUNT + REFERENTE + OPPORTUNITA'"
        }
      - { from: Non qualificato, to: Motivazione uscita }

  opportunity:
    source: [DGM-1, DGM-2]
    states:
      [
        Qualificato,
        "In trattativa (Prev inviato)",
        "Da ricontattare - Prev. inviato",
        Chiusa/Vinta,
        Chiusa/Persa
      ]
    rules:
      - Created automatically when the contact is qualified
      - Multiple quotes allowed per opportunity
      - An existing client's request enters directly as an OPPORTUNITA'
      - "Chiusa/Vinta requires at least one quote sent; payment confirms the win"

  quote:
    source: [DGM-1, DGM-2]
    states:
      [
        Bozza,
        "In trattativa (Prev inviato)",
        "In attesa di accettazione",
        "Accettato - Copia Contabile Ricevuta",
        Rifiutata
      ]
    rules:
      - "'In attesa di accettazione' is the new label for the former 'preventivo scaduto'"
      - Validity 5 days
      - Expiry date mandatory, set by the tutor at send
      - Alert to tutor and client on day 2 after sending, and again at expiry
      - "Accettato and Rifiutata are manual tutor actions"
      - New quote created manually via a button

  order:
    source: [DGM-2]
    types:
      - { value: STANDARD, note: default }
      - { value: BUNDLE, note: "Order type == Bundle - Vendita da palco" }
      - { value: PLUS, note: "Order type == Plus + Attivazione o Rinnovo" }
    states: [CREATO, CHIUSO/ACQUISITO]
    states_agreed_06_08: [Ordinato, Fatturato, Incassato]
    status: conflict # ⚠ unreconciled — see reconciliation below
    reconciliation: >-
      The states above come from DGM-2. The 2026-08-06 closing session replaced them
      with Ordinato -> Fatturato -> Incassato and struck "Chiuso acquisito" outright
      ("non serve piu", Fabrizio Paganelli), with the Opportunity going Closed Won
      only when the order reaches Incassato. Nobody has stated whether Incassato is
      CHIUSO/ACQUISITO renamed or a different milestone. This is unresolved because
      (a) tranche.states below still uses CHIUSO/ACQUISITO, (b) name_collisions
      documents CHIUSO/ACQUISITO as a deliberate Order/Tranche pair, and (c) a fourth
      order state "Perso", tied to credit notes, was floated and left undecided.
      Owner: Elena Spini. Must close before Order or Tranche is configured.
      2026-08-20: DGM-2 now DRAWS Ordinato/Fatturato/Incasato — on LEAD-OPTY as a
      new ORDINE block and again on Ordini — with the rule "Status Order ==
      Incassato >> Aggiornamento dell'Opty in Chiusa Vinta". It did NOT strike the
      old values: Order Status SF == CHIUSO/ACQUISITO and == CREATO are still on
      the Ordini page and tranche.states still uses CHIUSO/ACQUISITO. So the
      source now carries both vocabularies and the question is still unanswered.
      Only three states are drawn; no "Perso". states/ states_agreed_06_08 above
      are deliberately left as they are — the edit is unminuted.
    creation_systems: [WooCommerce, SFDC, Mexal]
    rules:
      # superseded 2026-08-27 by live verification against the delivered plugin - see ORD-12
      - "A WooCommerce order reaches SFDC when its WooCommerce status becomes IN LAVORAZIONE or COMPLETATO, for any payment method (2026-08-27; supersedes 'not visible until COMPLETATO', DGM-2)"
      - "Bank transfer: administration waits for the transfer, then sets the WooCommerce order to COMPLETATO"
      - "Card payment: completes automatically"
      - "CHIUSO/ACQUISITO is set manually by administration within max 5 days of confirmed payment"
    opportunity_types:
      - "Vendita da tutor"
      - "Recall tutor"
      - "Plus + Attivazione o Rinnovo" # added 2026-08-14 from DGM-2; drives contract generation

  tranche:
    source: [DGM-2, AUREL-2026-08-24-TRANCHE]
    status: conflict
    states: [CREATO, CHIUSO/ACQUISITO]
    rules:
      - "After products are selected on the Quote, a guided action creates each tranche by asking which Quote Line Items it contains and the planned payment due date"
      - "Each selected Quote Line Item stores the tranche reference and due date; both propagate to the corresponding Order Item"
      - "Mexal updates payment status at order-line level; SFDC aggregates upward and marks the tranche fully paid only when every included line is fully paid"
      - "Mexal never creates or writes the tranche"
    reconciliation: >-
      Creation and roll-up mechanics were decided by Aurel Mrruku on 2026-08-24.
      The final paid-state API value remains open: DGM-2 says
      CHIUSO/ACQUISITO, while the newer order vocabulary uses Incassato. Do not
      configure that label until OI-69 is resolved.

  asset:
    source: [DGM-2, DIRECT-2026-08-24-ASSET]
    label_in_diagram: "Asset == Ticket evento"
    label_in_org: "Biglietto__c (custom object)"
    target_object: "Asset (standard Salesforce object)"
    implementation_gap: "Biglietto__c must be replaced or migrated; effort not estimated"
    states:
      [Ordinato, Assegnato, Disponibile, Non utilizzato, Utilizzato, Annullato]
    transitions:
      - {
          from: Ordinato,
          to: Disponibile,
          trigger: "Fattura pagata a livello di Tranche o riga d'ordine"
        }
      - {
          from: Disponibile,
          to: Assegnato,
          trigger: "Participant list confirmed by the referent"
        }
      - { from: Assegnato, to: Utilizzato, trigger: "QR scanned at the event" }
      - {
          from: Assegnato,
          to: Non utilizzato,
          trigger: "3 days after the event"
        }
      - {
          from: Assegnato,
          to: Annullato,
          trigger: "Name change (option 1) or credit note"
        }

# =============================================================================
# PICKLISTS — verbatim from DGM-1
# =============================================================================
picklists:
  lead_motivazione_uscita:
    definition_perso: "Il lead era potenzialmente giusto, ma per motivi commerciali (prezzo, timing, concorrenza) non si è chiuso."
    definition_errato: "Il lead non avrebbe mai dovuto entrare — profilo sbagliato, zona non coperta, fuori target."
    note: "I lead con Motivazione Uscita == Errato hanno una sotto-categoria dedicata ed esportabile, per analizzare la qualità delle sorgenti nel tempo."
    perso:
      - Non interessato
      - Prezzo alto
      - Sceglie concorrenza (lista competitor da selezionare)
      - Servizio non adatto (per caratteristiche attività)
    errato:
      - Ha già P.Pro
      - Già in contatto
      - Dati per il contatto inesatti
      - Duplicato da CRM
      - Non in target (non è ristoratore)
      - Richiesta inviata per errore
      - "SW House, Ag. Marketing, Web Agency"
      - Test
  opportunity_chiusa_persa:
    - Prezzo alto
    - Sceglie concorrenza (lista competitor da selezionare)
    - Tempistiche di erogazione servizio
    - Servizio/prodotto non allineato con le aspettative
  opportunity_da_ricontattare:
    - Data corso incompatibile
    - Locale ancora da aprire
    - Non risponde
    - Rimanda acquisto per prezzo
    - Rimanda acquisto per motivi personali
    - Rimanda acquisto per problemi con attività
    - Richiamare dopo la stagione
  quote_da_ricontattare:
    - Richiamare dopo la stagione
    - Ha da fare
    - Deve pensarci
  asset_status:
    # ⚠ This is the DISPLAY order as drawn in DGM-2 — it is NOT the lifecycle sequence.
    # Anything that renders these left-to-right must use flow_order below, or it will
    # contradict the state diagram on the same page.
    # ⚠ 2026-08-20 — DGM-2 now draws a SEVENTH box, "Rinuncia", between Disponibile and
    # Assegnato, annotated "Avviene nella comunicazione dei partecipanti o accetta o
    # rinuncia". It is NOT added below: the edit is unminuted, and BIG-17's six states
    # stand until Elena Spini or Sabatino Rinaldi rules on it. See OI-74. Do not
    # reconfigure the picklist from this comment.
    display_order:
      [Ordinato, Assegnato, Disponibile, Non utilizzato, Utilizzato, Annullato]
    flow_order:
      [Ordinato, Disponibile, Assegnato, Utilizzato, Non utilizzato, Annullato]
    terminal: [Utilizzato, Non utilizzato, Annullato]
  order_type: [STANDARD, BUNDLE, PLUS]
  opportunity_type: ["Vendita da tutor", "Recall tutor"]
  # The client's own seven sales typologies, verbatim from the Excel and PDF they supplied,
  # per meetings/results/2026-06-30-sales-types-quotes.md line 7. Distinct from order_type.
  sales_typology:
    - stage sales
    - tutor packages
    - tutor combo
    - tutor one-shot
    - Performance Plus
    - product sales
    - Pienissimo Pro

