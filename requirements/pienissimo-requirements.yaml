# =============================================================================
# RECONCILIATION — points where the sources do not agree, or where ROMI is
# asking to change something already agreed. Each needs a ruling on 6 August.
#
# `kind` matters more than the old blanket word "contradiction":
#   ratification  — already built or already true; the room accepts or pays to undo it
#   clarification — the two sources are compatible once separated; nothing to choose
#   open_question — never actually decided; the "disagreement" was a mis-reading
#   walk_back     — ROMI asks to reverse a decision the record shows as agreed
#   correction    — a value or list in ROMI's own material is wrong
#
# `evidence_grade` states what a citation can be shown against:
#   minuted    — a recap file exists in meetings/results/
#   emailed    — Elena circulated minutes by email; not in the repo
#   ai_notes   — Gemini meeting notes only, no human-written minutes
#   org        — verified directly against the Salesforce UAT org
# =============================================================================
reconciliation:
  - id: RC-01
    kind: resolved
    topic: Ticket object — standard Salesforce Asset selected
    requirement: DM-22
    design_says: "Asset == Ticket evento, i.e. the standard Salesforce Asset object [DGM-2]"
    org_says: "Custom object Biglietto__c is live with six active Apex classes for DocuSign and PDF"
    decision_says: "Use the standard Asset object [DIRECT-2026-08-24-ASSET]"
    evidence_grade: direct_instruction_and_org
    honest_framing: >
      The object decision is closed in favour of the standard Asset. The custom object remains the
      current UAT implementation and is now an implementation gap. Its fields, relationships and six
      Apex classes must be mapped before Biglietto__c is replaced or migrated.
    migration_effort: not estimated
    attribution: not stated in the direct instruction
    impact_on: BIG-01, BIG-02, BIG-03, BIG-17, BIG-18, BIG-19, BIG-20, BIG-21

  - id: RC-02
    kind: clarification
    topic: What triggers campaign creation, and what triggers ticket creation
    requirement: BIG-02
    design_says: "A Campaign is created automatically whenever the EVENTO product is created in Mexal [DGM-2]"
    minutes_say: "A Campaign is created when an order containing an event product arrives [22/07]"
    evidence_grade: emailed
    honest_framing: >
      These are not in conflict once separated: the campaign is created with the product, the
      tickets are created with the order. Today the two documents describe different automations
      because neither says which object it is talking about.
    proposed: "State both explicitly — campaign on product creation, tickets on order"
    default_if_undecided: "Ambiguous. The builder picks one, and the other document stays wrong."
    impact_on: build — one Flow or two

  - id: RC-03
    kind: open_question
    topic: How many reminders before an event, and on which channel
    requirement: BIG-06
    was_previously_framed_as: >
      A contradiction between "60 and 2 days" (DGM-2) and "60, 30, 15 and 1 days" (08/06).
      That framing was wrong and is withdrawn.
    what_the_record_actually_says: >
      meetings/results/2026-06-08-ticketing-compliance.md line 17, verbatim: "Reminder funnel for
      uncompiled tickets (they already run a WhatsApp/60-30-15-1-day funnel)". That is a
      description of Pienissimo's existing WhatsApp practice, in parentheses — not a stated
      requirement for the Salesforce reminders. No cadence for Salesforce was ever agreed.
    evidence_grade: minuted
    honest_framing: >
      Nothing was decided, so nothing contradicts. The real question has never been asked:
      does Salesforce replicate their four-touch WhatsApp cadence as email, or run the lighter
      two-touch 60/2 in the design file?
    trade_off: "Four touches costs more build and carries a spam risk on email; two touches risks a higher no-show rate"
    proposed: "Ask the question properly on 6 August. ROMI has no preference until Pienissimo states the channel."
    default_if_undecided: "60 and 2, per the design file, because it is what is drawn"
    impact_on: build — number of scheduled sends

  - id: RC-04
    kind: correction
    topic: Order typology values — ROMI's list was wrong
    requirement: DM-15
    design_says: "Three order types: STANDARD, BUNDLE, PLUS [DGM-2]"
    minutes_say: >
      meetings/results/2026-06-30-sales-types-quotes.md line 7, verbatim, from the sales-typology
      Excel and PDF Pienissimo themselves delivered: "stage sales, tutor packages, tutor combo,
      tutor one-shot, Performance Plus, product sales, Pienissimo Pro" — SEVEN values.
    romi_error: >
      Earlier versions of this register listed six invented values (stage sale, tutor, book,
      video course, PP activation, PP renewal). That list appears in no source document and is
      withdrawn.
    evidence_grade: minuted
    honest_framing: >
      Two different fields are being confused. DGM-2's three values drive automation. The client's
      seven describe what is being sold. Both can exist.
    proposed: "Order type = the three automation values; sales typology = the client's own seven, unchanged"
    default_if_undecided: "Three values only, and the client's seven typologies lose their home"
    impact_on: reporting — Marco loses the breakdown he supplied if the seven are dropped

  - id: RC-05
    kind: walk_back
    topic: ROMI asks to reverse the automatic cancellation of tickets on a credit note
    requirement: BIG-10
    what_was_agreed: >
      On 22/07 it was agreed that credit notes on event products would AUTOMATICALLY set the
      matching ticket to Annullato. This is recorded as an agreed decision, not as an open point.
    what_romi_now_asks: >
      That the tickets be selected MANUALLY in a pop-up instead, as drawn in DGM-2.
    romi_reason: >
      On a multi-event bundle a partial reversal cannot be inferred — the system has no way to
      know which of several tickets a credit note refers to.
    evidence_grade: emailed
    honest_framing: >
      This is ROMI asking to undo something the client already approved, for a technical reason.
      It is not a tie-break between two equal sources, and it should not be recorded as one.
    proposed: "Manual selection, with the reason above stated on the record"
    default_if_undecided: "The 22/07 decision stands: automatic cancellation, with the multi-event bundle case unsolved"
    impact_on: build and administration workload

  - id: RC-06
    kind: contradiction
    topic: Signature is still encoded in the ticket flow, after 06/08 struck it
    requirement: "BIG-01, BIG-12, BIG-19, BIG-21"
    register_says: >
      Four ticket requirements still carry signature as part of the ticket path.
      BIG-01 "Four-stage lifecycle: order, payment, signature, check-in";
      BIG-12 "QR issuance conditional on signature; confirmed by direction";
      BIG-19 "...adds campaign members, and sends the signature request";
      BIG-21 "Casi Limite button ... handling participant name change and missing signature".
    minutes_say: >
      meetings/results/2026-08-06-chiusura-punti-aperti.md removed signature from the ticket
      flow outright. Recorded in notes/flows/The ticket lifecycle.md, verbatim: "Signature is
      out of this flow. Participants sign on paper at check-in; DocuSign applies only to quotes
      and contracts. The 'mancata firma digitale' edge case was struck outright on 2026-08-06."
    evidence_grade: minuted
    honest_framing: >
      This is not a tie-break between two equal sources. A later meeting overrode an earlier
      design, and the register was never updated to follow. BIG-01 is the four-stage lifecycle
      that names the phases of the whole ticket flow, so the stale wording is load-bearing:
      anyone reading the signed document builds a signature step that was cancelled. Found on
      2026-08-15 while re-deriving the note-to-requirement trace, not raised in any meeting.
    proposed: >
      Restate BIG-01 as three stages (order, payment, check-in); drop the signature condition
      from BIG-12; drop "and sends the signature request" from BIG-19; reduce BIG-21 to the
      participant name-change case. Requires the same edit in REQUIREMENTS.md and
      REQUISITI.it.md, and the Italian is the text the client signs.
    default_if_undecided: "The register keeps describing a signature step that 06/08 cancelled"
    impact_on: build — a whole signature stage in the ticket flow, and the signed scope

  # =============================================================================

  - id: RC-07
    kind: superseded_requirement
    topic: Accept/reject buttons in the quote email were rejected, not deferred
    requirement: SAL-16
    register_says: "Accept/reject buttons inside the quote email [status: to_confirm, pri: C]"
    minutes_say: >
      The 2026-08-06 closing session replaced them with a link to a landing page showing
      preventivo + contratto + condizioni generali as a single PDF, with Accetto / Rifiuto.
      The stated reason is that buttons in an email would have let an external client mutate
      CRM data directly.
    evidence_grade: minuted
    honest_framing: >
      SAL-16 is not an open question waiting for confirmation. It was decided against, and the
      replacement is designed and owned. Leaving it as to_confirm reads to anyone planning the
      build as though the email-button option is still on the table, which it is not.
    proposed: "Set SAL-16 status to rejected and cite OI-68 as the superseding decision."
    default_if_undecided: >
      A reader of the register plans for a control that the design deliberately removed. Harmless
      today because nothing is built; misleading at sign-off, because SAL-16 is a C-priority item
      that will read as descoped-by-omission rather than rejected-on-security-grounds.
    impact_on: OI-68, SAL-17, flow-quote-to-order

  - id: RC-08
    kind: incomplete_requirement
    topic: The opportunity type field carries two different vocabularies
    requirement: SAL-21
    register_says: "Opportunity type field with values Vendita da tutor and Recall tutor [DGM-2]"
    minutes_say: >
      The 2026-08-06 session requires the same field to be typed attivazione versus rinnovo for
      Performance Plus, because contract auto-generation depends on it, and used opportunity
      typing to carry the stage-sale versus tutor-recall split as well.
    evidence_grade: minuted
    honest_framing: >
      These are not alternatives and not a contradiction — the built field
      Opportunity.Tipo_Opportunita__c is being asked to do two jobs, and the register documents
      only one of them. OI-70 states this in as many words. Nobody has said whether one picklist
      carries all four values, or whether attivazione/rinnovo belongs on a second field.
    proposed: >
      Decide one field or two, then extend SAL-21 or add a sibling requirement for the
      attivazione/rinnovo typing that drives contract generation.
    default_if_undecided: >
      The builder configures the two DGM-2 values, and Performance Plus contract auto-generation
      (OI-51) has no field to key on.
    impact_on: OI-70, OI-51, DM-15, RC-04

