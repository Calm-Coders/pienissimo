# -----------------------------------------------------------------------------
glossary:
  ACCOUNT: Ragione sociale qualificata, a prescindere dall'aver già acquistato. [DGM-1]
  OPPORTUNITA: Si apre quando il contatto manifesta un interesse economico. [DGM-1]
  LEAD_QUALIFICATO: Interessato a un appuntamento, richiede una demo, o richiede preventivo. [DGM-1]
  LEAD_NON_QUALIFICATO: Fuori target, non titolare di ristorante, ha compilato il form per curiosità. [DGM-1]
  TRANCHE: Piano di pagamento definito nel Preventivo selezionando righe e data di scadenza; riferimento e data passano poi alle righe d'ordine. [AUREL-2026-08-24-TRANCHE]
  ASSET_vs_QR: L'Asset è il record; il QR è un valore contenuto in esso e porta l'ID del campaign member. [22/07, DGM-2]
  ANNO_SOLARE: Classificazione dei bundle. Distinto da ANNO_ACCADEMICO (maggio-settembre) usato per la generazione biglietti. [23/07]

# Words that mean different things on different objects. When one of these is said aloud in a
# meeting, the record type must be named too, or nobody knows which object is being discussed.
name_collisions:
  - term: "In trattativa"
    lives_on: [Opportunity, Quote]
    note: "On the Opportunity it means a deal is being negotiated; on the Quote it means a specific quote is live within its 5 days."
  - term: "Da ricontattare"
    lives_on: [Lead, Opportunity, Quote]
    note: "On the Lead it is a task raised after Non Risponde; on the Opportunity and the Quote it is a status, each with its own picklist of reasons."
  - term: "CHIUSO / ACQUISITO"
    lives_on: [Order, Tranche]
    note: "On the Order it is set manually by administration within 5 days of confirmed payment; on the first Tranche it is set automatically the moment the deposit is paid."
  - term: "preventivo scaduto"
    lives_on: [Quote]
    note: "Retired label. The state is now called 'In attesa di accettazione'. The room has used the old name for months and will keep using it."

# How the headline counts are built, so nobody has to reverse-engineer them.
count_basis:
  requirements_register: 154
  by_status: { agreed: 100, to_confirm: 21, open: 28, conflict: 5 }
  excluded_from_the_154:
    - "OUT-01..03 — scope-change requests, held in the scope block, not requirements"
    - "F2-01..05 — Phase 2 items, in scope but out of this freeze"
    - "AC-01..10 — acceptance criteria, which test requirements rather than being them"
    - "REG-01..02 — build regressions, recorded in build_state"
  note: >
    A grep for 'status: open' returns 31, not 28: the extra three are OUT-01/02/03, which carry a
    status but are not requirements. Any headline that says 28 must say 28 of what.

